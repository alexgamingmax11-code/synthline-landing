<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Synthline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0f;
            --text: #e8e8f0;
            --text-muted: #8888a0;
            --accent-1: #6366f1;
            --gradient: linear-gradient(135deg, #6366f1, #a855f7, #06b6d4);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; text-align: center;
            padding: 24px;
        }
        .content { max-width: 480px; }
        .code {
            font-size: 8rem; font-weight: 900;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1; margin-bottom: 8px;
        }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; }
        p { color: var(--text-muted); margin-bottom: 32px; line-height: 1.6; }
        a {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 32px;
            background: var(--gradient);
            color: #fff; font-weight: 600; font-size: 1rem;
            border: none; border-radius: 50px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        a:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99,102,241,0.4); }
        @media (max-width: 600px) { .code { font-size: 5rem; } }
    </style>
</head>
<body>
    <div class="content">
        <div class="code">404</div>
        <h1>This call didn't connect</h1>
        <p>Looks like this page doesn't exist. Our AI couldn't find it — but we can point you back to the right place.</p>
        <a href="/synthline-landing/">← Back to Synthline</a>
    </div>
</body>
</html>
